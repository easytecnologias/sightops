# O upstream estatico foi removido de proposito: ele resolvia o nome da API
# so no start do nginx e travava no IP antigo sempre que o container era
# recriado (3s de timeout por requisicao). Agora o nome e resolvido em tempo
# de execucao -- ver resolver/set no server abaixo.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    # DNS interno do Docker; valid=10s revalida o IP sem reiniciar o nginx
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    set $api_backend "cam-snapshot-api:8000";
    set $go2rtc_upstream "go2rtc:1984";

    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 25m;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~* ^/(inventory\.html|static/(app\.js|style\.css))$ {
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires off;
    }

    # Os assets usam ?v= no HTML. Podem ficar no cache por bastante tempo sem
    # prender uma versao antiga depois de uma publicacao.
    location ~* ^/v2/.+\.(?:css|js|svg|woff2?|ttf)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    # Snapshot muda mantendo o mesmo nome. Um cache curto evita baixar dezenas
    # de fotos novamente ao trocar de menu sem esconder uma captura nova.
    location ~* ^/data/.+\.(?:jpe?g|png|webp)$ {
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        expires 15s;
        add_header Cache-Control "public, max-age=15, stale-while-revalidate=60" always;
    }

    location /v2/ {
        alias /usr/share/nginx/html/v2/;
        index index.html;
        try_files $uri $uri/ /v2/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }


    location /v3-api/ {
        rewrite ^/v3-api(/.*)$ $1 break;
        proxy_pass http://172.28.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /v3/ {
        proxy_pass http://172.28.0.1:8087/v2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # Player WebRTC/MSE. So o WebSocket de sinalizacao passa; o resto da
    # API do go2rtc (que lista as URLs RTSP com usuario/senha de cada
    # camera em texto puro) fica bloqueado -- nunca deveria ter sido
    # exposto ao publico (mesmo bug corrigido em producao antes).
    # Zabbix e Grafana no MESMO dominio do SightOps.
    #
    # Por que: o botao "Abrir Zabbix" apontava para um IP interno com porta
    # fixa (10.10.12.7:8089 -- que ainda por cima e a porta do Zabbix do v2,
    # nao do v3). De fora da LAN isso nunca abre, e o endereco do servidor
    # tambem nao deveria estar escrito na tela.
    #
    # proxy_redirect reescreve o Location absoluto que o Zabbix devolve
    # ("/index.php") para dentro do subcaminho -- sem isso o login joga o
    # navegador na raiz e cai no SightOps.
    location = /zabbix { return 301 /zabbix/; }
    # Captura explicita ($1) de proposito: quando proxy_pass usa VARIAVEL, o
    # nginx nao troca o prefixo da location -- ele substitui a URI inteira
    # pela do diretivo. Com "proxy_pass http://$var/" todo caminho abaixo de
    # /zabbix/ chegava como "/", e o CSS vinha com o HTML do login no corpo.
    location ~ ^/zabbix/(.*)$ {
        set $zabbix_upstream "zabbix-v3-web:8080";
        proxy_pass http://$zabbix_upstream/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^/(.*)$ /zabbix/$1;
        proxy_read_timeout 120s;
    }

    location = /grafana { return 301 /grafana/; }
    # Ao contrario do Zabbix, o /grafana/ NAO e removido: com
    # serve_from_sub_path o Grafana espera receber o subcaminho na URI. Se
    # chegar "/", ele responde 301 para a root_url -- e como a root_url e
    # exatamente este endereco, o navegador entra em laco.
    location /grafana/ {
        set $grafana_upstream "grafana-v3:3000";
        proxy_pass http://$grafana_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # o painel usa websocket para atualizar em tempo real
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    location /go2rtc/api/ws {
        proxy_pass http://$go2rtc_upstream/api/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /go2rtc/ {
        deny all;
        access_log off;
        return 403;
    }

    location / {
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/ia/nvr/index {
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        proxy_pass http://$api_backend$request_uri;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
