# O Docker nao esperava as montagens do disco de dados.
#
# Os volumes dos dois Postgres (SightOps e Zabbix) moram em /mnt/dados e sao
# trazidos de volta para /var/lib/docker/volumes/<nome>/_data por bind mount no
# fstab. O diretorio por baixo do bind esta VAZIO. Se a montagem falhar no boot
# -- e ela usa `nofail`, entao o boot segue sem ela de proposito -- o Docker
# subia mesmo assim, o Postgres encontrava PGDATA vazio e rodava initdb: banco
# novo em branco, SightOps e Zabbix sem nada, e escrita no diretorio errado.
#
# Com RequiresMountsFor o Docker ganha Requires= e After= nessas montagens: sem
# elas, o Docker NAO sobe. E a troca certa -- ficar fora do ar avisando e muito
# melhor que subir com o banco vazio parecendo que os dados sumiram.
#
# Para desfazer: apagar este arquivo e `systemctl daemon-reload`.
[Unit]
RequiresMountsFor=/mnt/dados /var/lib/docker/volumes/sightops-v3-release_sightops_v3_postgres/_data /var/lib/docker/volumes/sightops-v3-release_zabbix_v3_postgres/_data
