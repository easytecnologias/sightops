services:
  cam-snapshot-api:
    image: ${CAM_SNAPSHOT_IMAGE:-ghcr.io/easytecnologias/cam-snapshot-web:prod}
    container_name: sightops-v3-api
    env_file:
      - .env.v3
    environment:
      # production desliga o admin de bootstrap automatico. Com qualquer
      # outro valor, subir a stack com o banco vazio CRIA o usuario
      # admin_teste/admin_teste como owner + admin de plataforma -- e essa
      # senha esta no codigo, publicado. Override so consciente, via .env.
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      ENABLE_DOCS: ${ENABLE_DOCS:-0}
      DATABASE_BACKEND: postgres
      DATABASE_HOST: sightops-v3-postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${SIGHTOPS_DB:-sightops_prod}
      DATABASE_USER: ${SIGHTOPS_DB_USER:-sightops_prod}
      DATABASE_PASSWORD: ${SIGHTOPS_DB_PASSWORD:?set SIGHTOPS_DB_PASSWORD in .env.v3}
      POSTGRES_ENABLED: 1
      AUTH_DATABASE_BACKEND: postgres
      AUTH_REQUIRED: ${AUTH_REQUIRED:-1}
      AUTH_LEGACY_OPEN: ${AUTH_LEGACY_OPEN:-0}
      ENABLE_LEGACY_STATE_IMPORT: ${ENABLE_LEGACY_STATE_IMPORT:-0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env.v3}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1}
      SIGHTOPS_SECRET_KEY: ${SIGHTOPS_SECRET_KEY:?set SIGHTOPS_SECRET_KEY in .env.v3}
      IMGBB_API_KEY: ${IMGBB_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VIDEO_MODEL: ${GEMINI_VIDEO_MODEL:-gemini-2.5-flash}
      SIGHTOPS_ACCESS_CONTROL_SYNC_INTERVAL: ${SIGHTOPS_ACCESS_CONTROL_SYNC_INTERVAL:-15}
    volumes:
      - sightops_v3_data:/app/data
      - sightops_v3_output:/app/output
    depends_on:
      sightops-v3-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/system/health/live', timeout=5).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sightops-prod
    restart: unless-stopped

  sightops-v3-nginx:
    image: nginx:1.27-alpine
    container_name: sightops-v3-nginx
    depends_on:
      cam-snapshot-api:
        condition: service_healthy
    ports:
      - "${SIGHTOPS_HTTP_PORT:-8088}:80"
      - "${SIGHTOPS_PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html/v2:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/system/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sightops-prod
    restart: unless-stopped

  sightops-v3-postgres:
    image: postgres:16-alpine
    container_name: sightops-v3-postgres
    environment:
      POSTGRES_DB: ${SIGHTOPS_DB:-sightops_prod}
      POSTGRES_USER: ${SIGHTOPS_DB_USER:-sightops_prod}
      POSTGRES_PASSWORD: ${SIGHTOPS_DB_PASSWORD:?set SIGHTOPS_DB_PASSWORD in .env.v3}
    ports:
      - "127.0.0.1:${SIGHTOPS_POSTGRES_PORT:-5435}:5432"
    volumes:
      - sightops_v3_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIGHTOPS_DB_USER:-sightops_prod} -d ${SIGHTOPS_DB:-sightops_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sightops-prod
    restart: unless-stopped

  zabbix-v3-postgres:
    image: postgres:16-alpine
    container_name: zabbix-v3-postgres
    environment:
      POSTGRES_DB: ${ZABBIX_DB:-zabbix_v3}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix_v3}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?set ZABBIX_DB_PASSWORD in .env.v3}
    volumes:
      - zabbix_v3_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZABBIX_DB_USER:-zabbix_v3} -d ${ZABBIX_DB:-zabbix_v3}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sightops-prod
    restart: unless-stopped

  zabbix-v3-server:
    image: ${ZABBIX_SERVER_IMAGE:-zabbix/zabbix-server-pgsql:alpine-7.0-latest}
    container_name: zabbix-v3-server
    environment:
      DB_SERVER_HOST: zabbix-v3-postgres
      POSTGRES_DB: ${ZABBIX_DB:-zabbix_v3}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix_v3}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?set ZABBIX_DB_PASSWORD in .env.v3}
      ZBX_CACHESIZE: ${ZBX_CACHESIZE:-64M}
      ZBX_HISTORYCACHESIZE: ${ZBX_HISTORYCACHESIZE:-32M}
      ZBX_TRENDCACHESIZE: ${ZBX_TRENDCACHESIZE:-32M}
      ZBX_VALUECACHESIZE: ${ZBX_VALUECACHESIZE:-32M}
    ports:
      - "${ZABBIX_SERVER_PORT:-10053}:10051"
    depends_on:
      zabbix-v3-postgres:
        condition: service_healthy
    networks:
      - sightops-prod
    restart: unless-stopped

  zabbix-v3-web:
    image: ${ZABBIX_WEB_IMAGE:-zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest}
    container_name: zabbix-v3-web
    environment:
      ZBX_SERVER_HOST: zabbix-v3-server
      DB_SERVER_HOST: zabbix-v3-postgres
      POSTGRES_DB: ${ZABBIX_DB:-zabbix_v3}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix_v3}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?set ZABBIX_DB_PASSWORD in .env.v3}
      PHP_TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${ZABBIX_WEB_PORT:-8091}:8080"
    depends_on:
      zabbix-v3-server:
        condition: service_started
      zabbix-v3-postgres:
        condition: service_healthy
    networks:
      - sightops-prod
    restart: unless-stopped

  zabbix-v3-agent2:
    image: ${ZABBIX_AGENT_IMAGE:-zabbix/zabbix-agent2:alpine-7.0-latest}
    container_name: zabbix-v3-agent2
    environment:
      ZBX_HOSTNAME: ${ZABBIX_AGENT_HOSTNAME:-sightops-v3-docker-host}
      ZBX_SERVER_HOST: zabbix-v3-server
      ZBX_SERVER_PORT: 10051
    depends_on:
      zabbix-v3-server:
        condition: service_started
    networks:
      - sightops-prod
    restart: unless-stopped

  grafana-v3:
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:latest}
    container_name: grafana-v3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.v3}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ${GRAFANA_INSTALL_PLUGINS:-alexanderzobnin-zabbix-app}
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    volumes:
      - grafana_v3_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      zabbix-v3-web:
        condition: service_started
    networks:
      - sightops-prod
    restart: unless-stopped

  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: sightops-v3-go2rtc
    volumes:
      - ./deploy/go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1984/api/streams"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sightops-prod
    restart: unless-stopped

  sightops-v3-iso-provisioner:
    build:
      context: ./deploy/iso-provisioner
    image: sightops-v3-iso-provisioner:latest
    container_name: sightops-v3-iso-provisioner
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - sightops_v3_data:/app/data
      - /etc/wireguard/wg-sightops.conf:/etc/wireguard/wg-sightops.conf:ro
    restart: unless-stopped

volumes:
  sightops_v3_data:
  sightops_v3_output:
  sightops_v3_postgres:
  zabbix_v3_postgres:
  grafana_v3_data:

networks:
  sightops-prod:
    name: sightops-v3-platform
